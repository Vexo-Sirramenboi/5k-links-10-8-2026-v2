name: Fetch Site

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/svg/site.svg
  # "/<repo-name>" for a project Pages site (user.github.io/repo/); set to "" for a custom domain or a user.github.io repo
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Crawl site into the repo root
        run: |
          rm -rf _ext index.html
          node scripts/mirror.js "$SITE_URL" .
          test -f index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _ext index.html
          git diff --cached --quiet || git commit -m "Update mirrored site"
          git push
