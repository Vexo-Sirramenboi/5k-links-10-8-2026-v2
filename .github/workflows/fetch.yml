name: Fetch Site

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # daily; remove if you only want manual runs

permissions:
  contents: write

env:
  SITE_URL: https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/svg/site.svg
  # "/<repo-name>" for a project Pages site (user.github.io/repo/); "" for a custom domain or user/org site
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Crawl site and save all dependencies
        run: |
          rm -rf site
          node scripts/mirror.js "$SITE_URL" site
          test -f site/index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git diff --cached --quiet || git commit -m "Update mirrored site"
          git push
