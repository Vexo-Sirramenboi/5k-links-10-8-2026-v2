name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Fetch Site"]
    types: [completed]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          if [ ! -f index.html ]; then
            echo "::error::index.html not found. Run the 'Fetch Site' workflow first."
            exit 1
          fi
          mkdir dist
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'scripts' \
            --exclude 'node_modules' --exclude 'package*.json' --exclude 'dist' \
            ./ dist/
          touch dist/.nojekyll   # so Pages serves the _ext folder
          find dist -type f | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
