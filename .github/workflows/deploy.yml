name: Mirror + 5,000 Pages Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # re-crawl daily; delete these two lines for manual/push only

permissions:
  contents: write

env:
  SITE_URL: https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/svg/site.svg
  # files under this URL are saved at the site root with the same layout (svg/, assets/, ...); other hosts go in _ext/
  ROOT_PREFIX: https://cdn.jsdelivr.net/gh/nautilus-os/GUST@latest/
  TOTAL_PAGES: 5000
  # GitHub Pages caps a published site at ~1 GB; copies are reduced automatically to stay under this
  MAX_TOTAL_MB: 900
  # "/<repo-name>" for a project Pages site (user.github.io/repo/); set to "" for a custom domain or user.github.io repo
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Write build scripts
        run: |
          mkdir -p .build
          cat > .build/mirror.js <<'MIRROR_EOF'
          // Usage: node scripts/mirror.js <start-url> [outDir]
          // Loads the URL in headless Chromium, saves every resource it requests
          // (scripts, CSS, fonts, images, XHR/fetch...) under <outDir>/_ext/<host>/<path>,
          // rewrites absolute URLs inside text files to the local copies, and writes
          // <outDir>/index.html pointing at the saved start document.
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const START = process.argv[2];
          const OUT = process.argv[3] || 'site';
          const BASE = (process.env.BASE_PATH || '').replace(/\/$/, ''); // e.g. "/my-repo" for project Pages, "" for custom domain/user site
          // Files whose URL starts with ROOT_PREFIX are saved at the site root with the same relative layout
          // (so ../assets/x.js style references keep working); everything else goes under _ext/<host>/.
          const ROOT_PREFIX = process.env.ROOT_PREFIX || '';
          const SETTLE_MS = Number(process.env.SETTLE_MS || 8000);

          if (!START) { console.error('usage: node scripts/mirror.js <url> [outDir]'); process.exit(1); }

          const EXT = {
            'text/html': '.html', 'text/css': '.css', 'application/javascript': '.js', 'text/javascript': '.js',
            'application/x-javascript': '.js', 'application/json': '.json', 'image/svg+xml': '.svg',
            'image/png': '.png', 'image/jpeg': '.jpg', 'image/gif': '.gif', 'image/webp': '.webp',
            'image/x-icon': '.ico', 'image/vnd.microsoft.icon': '.ico', 'font/woff2': '.woff2',
            'font/woff': '.woff', 'font/ttf': '.ttf', 'application/wasm': '.wasm', 'audio/mpeg': '.mp3',
            'video/mp4': '.mp4', 'application/font-woff2': '.woff2', 'application/font-woff': '.woff',
          };
          const TEXT = /^(text\/|application\/(javascript|x-javascript|json)|image\/svg)/;

          function localPathFor(url, contentType) {
            const u = new URL(url);
            const inRoot = ROOT_PREFIX && url.startsWith(ROOT_PREFIX);
            let p = inRoot
              ? decodeURIComponent(new URL(url).pathname.slice(new URL(ROOT_PREFIX).pathname.length))
              : decodeURIComponent(u.pathname);
            if (p === '' || p.endsWith('/')) p += 'index';
            const ct = (contentType || '').split(';')[0].trim().toLowerCase();
            let ext = path.extname(p);
            if (!ext && EXT[ct]) { p += EXT[ct]; ext = EXT[ct]; }
            if (u.search) {
              const h = crypto.createHash('md5').update(u.search).digest('hex').slice(0, 8);
              p = p.slice(0, p.length - ext.length) + '.' + h + ext;
            }
            p = p.replace(/[:*?"<>|\\]/g, '_');
            return inRoot ? p.replace(/^\/+/, '') : `_ext/${u.host.replace(':', '_')}/${p.replace(/^\/+/, '')}`;
          }

          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROMIUM_PATH || undefined,
              args: ['--no-sandbox'],
            });
            const ctx = await browser.newContext({ ignoreHTTPSErrors: true });
            const page = await ctx.newPage();

            const saved = new Map(); // url -> { rel, type, body }
            const pending = [];
            page.on('response', (res) => {
              pending.push((async () => {
                try {
                  const url = res.url();
                  if (!/^https?:/.test(url) || res.request().method() !== 'GET') return;
                  if (res.status() < 200 || res.status() >= 300 || saved.has(url)) return;
                  const type = res.headers()['content-type'] || '';
                  const body = await res.body();
                  saved.set(url, { rel: localPathFor(url, type), type, body });
                } catch { /* redirects / aborted requests have no body */ }
              })());
            });

            await page.goto(START, { waitUntil: 'networkidle', timeout: 60000 }).catch((e) => console.warn('goto:', e.message));
            // nudge lazy loaders
            await page.evaluate(async () => {
              for (let y = 0; y < document.body?.scrollHeight; y += 600) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 100)); }
              window.scrollTo(0, 0);
            }).catch(() => {});
            await page.waitForTimeout(SETTLE_MS);
            await Promise.all(pending);
            await browser.close();

            if (!saved.has(START)) {
              // start URL may have redirected; take the first saved document as entry
              console.warn('Start URL response not captured directly.');
            }

            // build rewrite table (longest URLs first); handle https://, http:// and protocol-relative forms
            const entries = [...saved.entries()].sort((a, b) => b[0].length - a[0].length);
            const rewrite = (text) => {
              for (const [url, { rel }] of entries) {
                const local = `${BASE}/${rel}`;
                text = text.split(url).join(local);
                text = text.split(url.replace(/^https?:/, '')).join(local);
              }
              return text;
            };

            for (const [url, { rel, type, body }] of saved) {
              const dest = path.join(OUT, rel);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              const isText = TEXT.test(type.split(';')[0].trim().toLowerCase()) || /\.(svg|css|js|html|json)$/.test(rel);
              fs.writeFileSync(dest, isText ? rewrite(body.toString('utf8')) : body);
            }

            const entry = saved.get(START);
            const entryRel = entry ? entry.rel : [...saved.values()][0]?.rel;
            if (!entryRel) { console.error('Nothing was captured.'); process.exit(1); }
            fs.mkdirSync(OUT, { recursive: true });
            if (entryRel !== 'index.html') fs.writeFileSync(path.join(OUT, 'index.html'),
              `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting…</title>` +
              `<meta http-equiv="refresh" content="0; url=./${entryRel}"></head>` +
              `<body><a href="./${entryRel}">Continue</a></body></html>`);

            console.log(`Saved ${saved.size} files to ${OUT}/ (entry: ${entryRel})`);
            for (const { rel } of saved.values()) console.log('  ' + rel);
          })();
          MIRROR_EOF
          cat > .build/generate-pages.js <<'GENERATE_EOF'
          // Usage: node scripts/generate-pages.js <rawDir> <distDir>
          // <rawDir> is the crawl output made with BASE_PATH=/__BASE__ (a placeholder prefix).
          // Writes into <distDir>:
          //   - one copy of the site at the root
          //   - up to TOTAL_PAGES more FULL copies, each at its own random nested path (2-4 segments),
          //     with every internal URL rewritten to that copy's own path
          //   - /links/index.html and /links.txt listing every path
          // GitHub Pages caps a published site at ~1 GB, so the page count is reduced automatically
          // if TOTAL_PAGES full copies wouldn't fit (MAX_TOTAL_MB, default 900). Git LFS is not
          // supported by Pages, so it can't be used to get around the cap.
          const fs = require('fs');
          const path = require('path');

          const RAW = process.argv[2] || '.build/raw';
          const DIST = process.argv[3] || 'dist';
          const WANT = Number(process.env.TOTAL_PAGES || 5000);
          const BASE = (process.env.BASE_PATH || '').replace(/\/$/, '');
          const MAX_BYTES = Number(process.env.MAX_TOTAL_MB || 900) * 1024 * 1024;
          const TOKEN = '/__BASE__';
          const TEXT_EXT = /\.(svg|css|js|mjs|html|htm|json|txt|xml|map|webmanifest)$/i;

          // ---- read the raw crawl into memory once
          const files = [];
          (function walk(dir, rel = '') {
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name), r = rel ? `${rel}/${name}` : name;
              if (fs.statSync(full).isDirectory()) walk(full, r);
              else {
                const buf = fs.readFileSync(full);
                files.push({ rel: r, isText: TEXT_EXT.test(name), buf, text: TEXT_EXT.test(name) ? buf.toString('utf8') : null });
              }
            }
          })(RAW);

          const rootIndex = files.find(f => f.rel === 'index.html');
          if (!rootIndex) { console.error('No index.html in raw crawl (crawl failed?).'); process.exit(1); }
          const m = rootIndex.text.match(/url=\.\/([^"]+)"/);
          const ENTRY = m ? m[1] : null;            // null => the site ships its own real index.html
          const entryIsSvg = ENTRY && /\.svg$/i.test(ENTRY);

          // ---- how many full copies fit?
          const siteBytes = files.reduce((n, f) => n + f.buf.length, 0) * 1.05 + 4096; // small margin for longer rewritten URLs
          const fit = Math.max(0, Math.floor(MAX_BYTES / siteBytes) - 1); // -1 for the root copy
          const COUNT = Math.min(WANT, fit);
          console.log(`Site size ~${(siteBytes / 1048576).toFixed(2)} MB; ${WANT} requested, ${fit} fit under ${MAX_BYTES / 1048576} MB -> generating ${COUNT} copies.`);
          if (COUNT < WANT) console.warn(`::warning::Only ${COUNT} of ${WANT} full copies fit under the GitHub Pages size limit (site is ~${(siteBytes / 1048576).toFixed(2)} MB). Git LFS is not supported by Pages.`);

          function writeCopy(prefixPath /* '' or 'abc/def' */, wrapper) {
            const outBase = path.join(DIST, prefixPath);
            const urlBase = prefixPath ? `${BASE}/${prefixPath}` : BASE;
            for (const f of files) {
              const dest = path.join(outBase, f.rel);
              fs.mkdirSync(path.dirname(dest), { recursive: true });
              if (f.isText) fs.writeFileSync(dest, f.text.split(TOKEN).join(urlBase));
              else fs.writeFileSync(dest, f.buf);
            }
            if (wrapper && ENTRY) {
              fs.writeFileSync(path.join(outBase, 'index.html'), `<!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <base href="${urlBase}/">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>App</title>
          <style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}object{width:100%;height:100%;border:none;display:block}</style>
          </head><body><object data="${ENTRY}"${entryIsSvg ? ' type="image/svg+xml"' : ''}></object></body></html>
          `);
            }
          }

          // ---- unique random nested paths
          const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
          const seg = (min = 4, max = 10) => {
            const n = Math.floor(Math.random() * (max - min + 1)) + min;
            let s = '';
            for (let i = 0; i < n; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return s;
          };
          const nested = () => Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => seg()).join('/');
          const topLevel = new Set(files.map(f => f.rel.split('/')[0]).concat(['links']));
          const paths = new Set();
          while (paths.size < COUNT) {
            const p = nested();
            if (topLevel.has(p.split('/')[0])) continue;
            paths.add(p);
          }

          writeCopy('', false);                       // root copy (index.html = redirect to the entry)
          for (const p of paths) writeCopy(p, true);  // full copy per random path

          const list = [...paths];
          fs.writeFileSync(path.join(DIST, 'links.txt'), list.map(p => `${BASE}/${p}/`).join('\n') + '\n');
          fs.mkdirSync(path.join(DIST, 'links'), { recursive: true });
          fs.writeFileSync(path.join(DIST, 'links', 'index.html'), `<!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Links</title>
          <style>
          *{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif}
          h1{text-align:center;color:#f0f6fc;margin:0 0 6px}p{text-align:center;color:#8b949e;margin:0 0 18px}
          input{display:block;margin:0 auto 20px;width:100%;max-width:640px;padding:12px 16px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#f0f6fc;font-size:15px}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;max-width:1300px;margin:0 auto}
          a{display:block;padding:10px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#58a6ff;font:12px monospace;text-align:center;text-decoration:none;word-break:break-all}
          a:hover{background:#21262d}.hidden{display:none}
          </style></head><body>
          <h1>Links</h1><p>${list.length.toLocaleString()} paths</p>
          <input id="f" placeholder="Filter…" autocomplete="off">
          <main class="grid" id="g">${list.map(p => `<a href="${BASE}/${p}/">${p}</a>`).join('')}</main>
          <script>
          const cards=[...document.querySelectorAll('#g a')];
          document.getElementById('f').addEventListener('input',e=>{const t=e.target.value.toLowerCase().trim();cards.forEach(c=>c.classList.toggle('hidden',!c.textContent.includes(t)))});
          </script></body></html>`);

          console.log(`Done: root copy + ${list.length} full copies in ${DIST}`);
          GENERATE_EOF

      - name: Crawl site and save all dependencies
        run: |
          # BASE_PATH is a placeholder here; each copy gets its own real path in the next step
          BASE_PATH=/__BASE__ node .build/mirror.js "$SITE_URL" .build/raw

      - name: Generate 5,000 full copies at random nested paths
        run: |
          mkdir -p dist
          node .build/generate-pages.js .build/raw dist
          touch dist/.nojekyll
          test -f dist/index.html
          du -sh dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
